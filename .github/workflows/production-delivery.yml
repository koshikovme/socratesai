name: Production delivery
on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: delivery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Java, coverage and isolated PostgreSQL/Flyway tests
        env:
          SPRING_CONFIG_IMPORT: ''
        run: |
          docker info >/dev/null
          bash mvnw -B verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-verification
          path: |
            target/surefire-reports/*.xml
            target/site/jacoco/
            target/site/jacoco-core/
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: socratesai-frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: socratesai-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - name: Browser protocol-fixture journeys (no sandbox privileges)
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-verification
          path: |
            socratesai-frontend/coverage-native/
            socratesai-frontend/test-results/
          retention-days: 7

  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ml/requirements-serving.lock
            ml/requirements-test.txt
      - run: pip install -r ml/requirements-test.txt
      - name: Native inference, saved artifacts, readiness and checksum contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s ml -p 'test_*api.py'
          python ml/test_readiness.py
          python ml/test_policy_model.py
          python -m py_compile ml/policy_api.py

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Workflow syntax, shell and immutable action references
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
          for script in scripts/delivery/*.sh deploy/backend/*.sh; do bash -n "$script"; done
          sh -n socratesai-frontend/nginx/start.sh
          sh -n deploy/postgres/10-application-role.sh
      - name: Prove private inputs cannot enter any build context
        run: python3 scripts/delivery/context_check.py

  images:
    needs: [backend, frontend, policy, infrastructure]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build backend JRE image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: socratesai/backend:delivery-test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build same-origin TLS edge
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./socratesai-frontend
          load: true
          tags: socratesai/frontend:delivery-test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build checksum-verified inference image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./ml
          load: true
          tags: socratesai/policy-api:delivery-test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=policy-api
          cache-to: type=gha,mode=max,scope=policy-api
      - name: Cold-volume production Compose smoke with generated credentials and TLS
        run: bash scripts/delivery/smoke.sh
      - name: Gate application advisories and report upstream database findings
        run: bash scripts/delivery/scan.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-security-reports
          path: .delivery/scans/
          retention-days: 7
      - name: Save exactly the verified images for release promotion
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        run: docker save socratesai/backend:delivery-test socratesai/frontend:delivery-test socratesai/policy-api:delivery-test -o /tmp/delivery-images.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        with:
          name: verified-release-images
          path: /tmp/delivery-images.tar
          retention-days: 3

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: images
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Accept only version tags pointing to reviewed main history
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-images
          path: /tmp/release
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images and record immutable pull references
        run: |
          docker load -i /tmp/release/delivery-images.tar
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          mkdir -p .delivery/release
          for name in backend frontend policy-api; do
            if docker manifest inspect "$IMAGE_PREFIX/$name:$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo 'Release tag already exists; refusing to overwrite it' >&2
              exit 1
            fi
          done
          for name in backend frontend policy-api; do
            image="$IMAGE_PREFIX/$name"
            docker tag "socratesai/$name:delivery-test" "$image:$GITHUB_REF_NAME"
            docker tag "socratesai/$name:delivery-test" "$image:sha-$GITHUB_SHA"
            docker push "$image:$GITHUB_REF_NAME"
            docker push "$image:sha-$GITHUB_SHA"
            reference="$(docker image inspect "$image:$GITHUB_REF_NAME" --format '{{range .RepoDigests}}{{println .}}{{end}}' | awk -v prefix="$image@" 'index($0,prefix)==1 {print; exit}')"
            [[ -n "$reference" ]]
            printf '%s\n' "$reference" >> .delivery/release/images.txt
          done
          cp ml/models.manifest.json .delivery/release/models.manifest.json
          awk '/image: postgres:16-alpine@sha256:/ {print $2}' docker-compose.prod.yml > .delivery/release/platform-images.txt
          awk '/^FROM/ {print $2}' Dockerfile ml/Dockerfile socratesai-frontend/Dockerfile > .delivery/release/base-images.txt
          printf '%s\n' "$GITHUB_SHA" > .delivery/release/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest
          path: .delivery/release/
          retention-days: 30
