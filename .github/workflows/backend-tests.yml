name: Automated Tests

on:
  push:
    branches:
      - main
      - master
      - develop
      - '**'
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend verification with coverage gates
        run: mvn -B verify

      - name: Upload backend coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jacoco-report
          path: |
            target/site/jacoco
            target/site/jacoco/jacoco.xml

  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: socratesai-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: socratesai-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend coverage with quality gates
        run: npm run test:coverage

      - name: Upload frontend coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: socratesai-frontend/coverage
