spring:
  datasource:
    url: jdbc:h2:mem:socratesai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  liquibase:
    enabled: false
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: c29jcmF0ZXNhaS10ZXN0LWp3dC1zZWNyZXQtbWluaW11bS02NC1ieXRlcy1vbmx5LWZvci10ZXN0cy0yMDI2
    expiration-ms: 86400000
  gemini:
    enabled: false
    api-key: test
    model: gemini-2.5-flash
    base-url: https://gemini.example.test
  openai:
    enabled: false
    api-key: test
    model: gpt-4.1-mini
    base-url: https://openai.example.test
  policy:
    mode: rule
    rule-version: rule-v1
    guardrail-version: guardrails-v1
    ml:
      enabled: false
      version: ml-v1
      base-url: http://localhost:8001
      predict-path: /predict
      fallback-to-rule: true
  websocket:
    allowed-origins: http://localhost:5173
