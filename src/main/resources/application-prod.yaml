spring:
  config:
    import: ${APP_RUNTIME_CONFIG_IMPORT:optional:file:/run/config/runtime-catalog.yaml}
  datasource:
    url: ${APP_DATASOURCE_URL}
    username: ${APP_DATASOURCE_USERNAME}
    password: ${APP_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false
  flyway:
    enabled: true

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info

app:
  deployment:
    domain: ${APP_DOMAIN}
    public-origin: ${APP_PUBLIC_ORIGIN}
  websocket:
    allowed-origins: ${APP_WEBSOCKET_ALLOWED_ORIGINS:${APP_PUBLIC_ORIGIN}}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
  gemini:
    enabled: ${APP_GEMINI_ENABLED:false}
    api-key: ${GEMINI_API_KEY:}
  openai:
    enabled: ${APP_OPENAI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
  policy:
    mode: ${APP_POLICY_MODE:rule}
    ml:
      enabled: ${APP_POLICY_ML_ENABLED:false}
      base-url: ${APP_POLICY_ML_BASE_URL:http://localhost:8001}
      predict-path: ${APP_POLICY_ML_PREDICT_PATH:/predict-mentor-state}
      version: ${APP_POLICY_ML_VERSION:codeforces-source-v1}
      fallback-to-rule: ${APP_POLICY_ML_FALLBACK_TO_RULE:true}
      min-confidence: ${APP_POLICY_ML_MIN_CONFIDENCE:0.35}

springdoc:
  api-docs:
    enabled: ${APP_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${APP_SWAGGER_ENABLED:false}

server:
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring.lifecycle.timeout-per-shutdown-phase: 25s
management:
  endpoints.web.exposure.include: health
  endpoint:
    health:
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
