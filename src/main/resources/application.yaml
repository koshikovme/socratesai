spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: socratesai

  datasource:
    url: ${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5433/socratesdb}
    username: ${APP_DATASOURCE_USERNAME:postgres}
    password: ${APP_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${APP_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${APP_FORMAT_SQL:false}

logging:
  level:
    org.hibernate.SQL: ${APP_HIBERNATE_SQL_LOG_LEVEL:info}
    org.hibernate.orm.jdbc.bind: ${APP_HIBERNATE_BIND_LOG_LEVEL:info}
    liquibase: info

app:
  authoring:
    verification:
      timeout: ${APP_REFERENCE_VERIFICATION_TIMEOUT:30s}
      evidence-ttl: ${APP_REFERENCE_VERIFICATION_EVIDENCE_TTL:30m}
      max-concurrent: ${APP_REFERENCE_VERIFICATION_MAX_CONCURRENT:4}
      batch-size: ${APP_REFERENCE_VERIFICATION_BATCH_SIZE:5}
  admin:
    bootstrap:
      enabled: ${APP_ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${APP_ADMIN_BOOTSTRAP_EMAIL:}
      password: ${APP_ADMIN_BOOTSTRAP_PASSWORD:}
      full-name: ${APP_ADMIN_BOOTSTRAP_FULL_NAME:}
  execution:
    worker:
      enabled: ${APP_JUDGING_ENABLED:true}
      concurrency: ${APP_JUDGING_CONCURRENCY:4}
      batch-size: ${APP_JUDGING_BATCH_SIZE:5}
      max-attempts: ${APP_JUDGING_MAX_ATTEMPTS:3}
      max-per-user: ${APP_JUDGING_MAX_PER_USER:5}
      max-queued: ${APP_JUDGING_MAX_QUEUED:1000}
      lease: ${APP_JUDGING_LEASE:15s}
      deadline: ${APP_JUDGING_DEADLINE:5m}
      sample-ttl: ${APP_JUDGING_SAMPLE_TTL:15m}
      initial-backoff: ${APP_JUDGING_INITIAL_BACKOFF:1s}
      max-backoff: ${APP_JUDGING_MAX_BACKOFF:10s}
    judge0:
      enabled: ${APP_JUDGE0_ENABLED:false}
      base-url: ${APP_JUDGE0_BASE_URL:}
      auth-header: ${APP_JUDGE0_AUTH_HEADER:X-Auth-Token}
      api-key: ${APP_JUDGE0_API_KEY:}
      allow-plain-http: ${APP_JUDGE0_ALLOW_PLAIN_HTTP:false}
      connect-timeout: ${APP_JUDGE0_CONNECT_TIMEOUT:2s}
      request-timeout: ${APP_JUDGE0_REQUEST_TIMEOUT:5s}
      operation-timeout: ${APP_JUDGE0_OPERATION_TIMEOUT:30s}
      initial-backoff: ${APP_JUDGE0_INITIAL_BACKOFF:100ms}
      max-backoff: ${APP_JUDGE0_MAX_BACKOFF:2s}
      catalog-ttl: ${APP_JUDGE0_CATALOG_TTL:1m}
      max-batch-size: ${APP_JUDGE0_MAX_BATCH_SIZE:5}
      max-concurrent-operations: ${APP_JUDGE0_MAX_CONCURRENT_OPERATIONS:16}
      max-response-bytes: ${APP_JUDGE0_MAX_RESPONSE_BYTES:2097152}
      max-source-bytes: ${APP_JUDGE0_MAX_SOURCE_BYTES:80000}
      max-test-bytes: ${APP_JUDGE0_MAX_TEST_BYTES:65536}
      max-processes: ${APP_JUDGE0_MAX_PROCESSES:64}
      max-poll-attempts: ${APP_JUDGE0_MAX_POLL_ATTEMPTS:100}
      runtimes: []
  jwt:
    secret: ${APP_JWT_SECRET:c29jcmF0ZXNhaS1sb2NhbC1kZXYtand0LXNlY3JldC1taW5pbXVtLTY0LWJ5dGVzLWNoYW5nZS1tZS0yMDI2IQ==}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  gemini:
    enabled: ${APP_GEMINI_ENABLED:true}
    api-key: ${GEMINI_API_KEY:}
    model: ${APP_GEMINI_MODEL:gemini-2.5-flash-lite}
    base-url: ${APP_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  openai:
    enabled: ${APP_OPENAI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${APP_OPENAI_MODEL:}
    base-url: ${APP_OPENAI_BASE_URL:https://api.openai.com/v1}

  policy:
    mode: ${APP_POLICY_MODE:ml}
    rule-version: ${APP_POLICY_RULE_VERSION:rule-v1}
    guardrail-version: ${APP_POLICY_GUARDRAIL_VERSION:guardrails-v1}
    ml:
      enabled: ${APP_POLICY_ML_ENABLED:false}
      version: ${APP_POLICY_ML_VERSION:codeforces-source-v1}
      base-url: ${APP_POLICY_ML_BASE_URL:http://localhost:8001}
      predict-path: ${APP_POLICY_ML_PREDICT_PATH:/predict-mentor-state}
      fallback-to-rule: ${APP_POLICY_ML_FALLBACK_TO_RULE:true}
      min-confidence: 0.35

  websocket:
    allowed-origins: ${APP_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
