spring:
  application:
    name: socratesai

  datasource:
    url: jdbc:postgresql://localhost:5433/socratesdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    liquibase: info

app:
  jwt:
    secret: 1c52ae5f47a7d4e3cbbeb1665a959fbfc1ec1f07fb1e4063009c482cd89738c49440d48e1ef489b7ae08529a08dac64420a747c72bf31f89b786d8cf586025bc
    expiration-ms: 86400000
  gemini:
    enabled: true
    api-key: AIzaSyBT5CdgGRtwwlN4Nvem5ItislQBoceMPio
    model: gemini-2.5-flash
    base-url: https://generativelanguage.googleapis.com/v1beta

  policy:
    mode: ml
    rule-version: rule-v1
    guardrail-version: guardrails-v1
    ml:
      enabled: true
      version: ml-v1
      base-url: http://localhost:8001
      predict-path: /predict
      fallback-to-rule: true

  websocket:
    allowed-origins: "http://localhost:3000,http://localhost:5173"
