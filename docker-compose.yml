version: "3.9"

services:
  pg_db:
    image: postgres:16
    container_name: socrates-postgres
    restart: always
    environment:
      POSTGRES_DB: socratesdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  db: