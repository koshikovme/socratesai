# Dedicated execution VM only. Never include these privileged workers in the application mesh.
x-logs: &logs
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
x-engine: &engine
  image: ${JUDGE_IMAGE:?Set the tested local Judge0 image identifier}
  restart: unless-stopped
  privileged: true
  cgroup: host
  volumes:
    - ./private/judge0.conf:/judge0.conf:ro
  logging: *logs
  pids_limit: 256
  networks: [execution-net]
services:
  server:
    <<: *engine
    networks: [execution-net, api-net]
    ports: ['10.93.0.2:2358:2358']
    mem_limit: 768m
    cpus: 0.5
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, ruby, -rsocket, -e, "TCPSocket.new('127.0.0.1',2358).close"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
  worker:
    <<: *engine
    command: [./scripts/workers]
    mem_limit: 2g
    cpus: 1
    stop_grace_period: 30s
    depends_on:
      server: {condition: service_healthy}
  db:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [judge_data:/var/lib/postgresql/data]
    networks: [execution-net]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 96
    logging: *logs
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: ${REDIS_IMAGE:?Set a pinned Redis image}
    restart: unless-stopped
    command: [sh, -c, 'exec redis-server --appendonly no --maxmemory 96mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    networks: [execution-net]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    logging: *logs
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12
networks:
  api-net:
    driver: bridge
  execution-net:
    internal: true
volumes:
  judge_data:
