worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe '$request_id $request_method $status $body_bytes_sent';
    access_log /dev/stdout safe;
    server_tokens off;
    sendfile on;
    client_max_body_size 16m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        root /usr/share/nginx/html;
        set $backend http://backend:8080;
        add_header X-Socrates-Demo synthetic-judging always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        sub_filter '<div id="app">' '<aside role="note" data-testid="demo-banner" style="padding:14px;background:#fff1c2;color:#382e0b;text-align:center;font:16px sans-serif">ЛОКАЛЬНОЕ ДЕМО: проверка кода имитируется. Программы не компилируются и не выполняются.</aside><div id="app">';
        sub_filter_once on;
        location = /healthz { access_log off; return 200 'ok\n'; }
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection '';
            proxy_cache off;
            proxy_read_timeout 35s;
            proxy_pass $backend;
        }
        location /ws {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 90s;
            proxy_pass $backend;
        }
        location /actuator { return 404; }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
